name: Reproduce experiment evidence
on: [push, pull_request]
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deterministic analysis
        run: python scripts/pipeline.py
      - name: Robustness check (bootstrap + guardrail power)
        run: python scripts/robustness.py
      - name: Validate statistics and data semantics
        run: python -m unittest discover -s tests -v
      - name: Check committed evidence is reproducible
        run: python scripts/check_evidence.py
